
name: NEPSE Daily Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Nepse Discord Bot

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run NEPSE bot
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python share_data.py
